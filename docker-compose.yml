# Infraestructura local del sistema de facturacion.
#   docker compose up -d   -> MySQL + MongoDB + Cassandra (+ carga inicial)
# El motor analitico Apache Druid corre aparte, en Ubuntu WSL2: infra/wsl/start-druid.sh
name: facturacion

services:

  # ---------------- MySQL: modulo transaccional (facturas, detalle_factura) ----------------
  mysql:
    image: mysql:8.4
    container_name: facturacion-mysql
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M"]   # menor consumo de RAM
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: facturacion
      MYSQL_USER: facturacion
      MYSQL_PASSWORD: facturacion123
      TZ: America/Bogota
    ports:
      - "3307:3306"   # 3307 en el host para no chocar con un MySQL local instalado
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------- MongoDB: catalogo de productos ----------------
  mongodb:
    image: mongo:7.0
    container_name: facturacion-mongodb
    command: ["--wiredTigerCacheSizeGB", "0.25"]   # menor consumo de RAM
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123
      MONGO_INITDB_DATABASE: facturacion
    ports:
      - "27018:27017"   # 27018 en el host para no chocar con un MongoDB local instalado
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------- Apache Cassandra: personas ----------------
  cassandra:
    image: cassandra:4.1
    container_name: facturacion-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: facturacion-cluster   # datacenter por defecto: datacenter1
      MAX_HEAP_SIZE: 384M
      HEAP_NEWSIZE: 96M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  # Crea keyspace, tabla e indice, y carga las personas de ejemplo (corre una vez y termina).
  cassandra-init:
    image: cassandra:4.1
    container_name: facturacion-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./infra/cassandra/init.cql:/init.cql:ro
    entrypoint: ["cqlsh", "cassandra", "9042", "-f", "/init.cql"]
    restart: "no"

volumes:
  mysql_data:
  mongo_data:
  cassandra_data:
